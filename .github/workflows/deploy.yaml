
name: Build & Deploy to EKS (Private) via Self-hosted Runner

on:
  push:
    branches: [ "result" ]
  workflow_dispatch:

# Required for OIDC
permissions:
  id-token: write
  contents: read

# 🔧 Set your values here (or use repository/environment secrets)
env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: training
  ECR_REPO: result
  RELEASE_NAME: result-helm
  NAMESPACE: default
  CHART_PATH: deploy/chart

jobs:
  deploy:
    # Your self-hosted runner labels (example)
    runs-on: [ self-hosted, linux, eks-vpc ]

    # Prevent overlapping deployments
    concurrency:
      group: deploy-${{ env.NAMESPACE }}
      cancel-in-progress: false

    # (Optional) tie IAM trust to GitHub Environments for stricter control
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image coordinates
        id: vars
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "ECR_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}" >> $GITHUB_OUTPUT

      - name: Build & push image
        run: |
          docker build -t ${{ steps.vars.outputs.ECR_URI }}:${{ steps.vars.outputs.IMAGE_TAG }} .
          docker push ${{ steps.vars.outputs.ECR_URI }}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: '1.30.0' # match your cluster minor version

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.4'

      - name: Update kubeconfig (private endpoint reachable from runner)
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Helm upgrade
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} --create-namespace \
            --set image.repository=${{ steps.vars.outputs.ECR_URI }} \
            --set image.tag=${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Verify rollout
        run: |
          kubectl -n ${{ env.NAMESPACE }} rollout status deploy/${{ env.RELEASE_NAME }} --timeout=180s

      - name: Print diagnostics (optional)
        run: |
          kubectl -n ${{ env.NAMESPACE }} get pods -o wide
          kubectl get nodes -o wide
