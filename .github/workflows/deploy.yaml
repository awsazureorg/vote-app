---
name: Build & Deploy to EKS (Private) via Self-hosted Runner
on:
  push:
    branches:
      - result
  workflow_dispatch: null
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: training
  ECR_REPO: result
  RELEASE_NAME: result-helm
  CHART_PATH: deploy/chart
jobs:
  deploy:
    strategy:
      matrix:
        runner_label:
          - eks-vpc
        namespace:
          - default
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.runner_label }}
    concurrency:
      group: deploy-${{ matrix.namespace }}
      cancel-in-progress: false
    environment: prod
    env:
      NAMESPACE: ${{ matrix.namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print role ARN for diagnostics
        run: |
          echo "Using role ARN: 'arn:aws:iam::978751494571:role/github01'"
          echo "Region: '${{ env.AWS_REGION }}'"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::978751494571:role/github01
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Compute image coordinates
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (BuildKit)
        working-directory: ./result
        run: |
          set -euo pipefail
          docker buildx build \
          --push \
          -f Dockerfile \
          -t "${{ steps.vars.outputs.ECR_URI }}:${{ steps.vars.outputs.IMAGE_TAG }}" \ .
